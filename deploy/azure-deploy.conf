# Azure deploy settings for ReFlow (committed; NOTHING SECRET goes in here).
#
# Read by deploy/azure.sh, deploy/github-setup.sh, deploy/render-env.sh and
# the GitHub workflow .github/workflows/azure.yml (no GitHub Actions
# variables or secrets are used). The scripts fill in the "written by" lines;
# the last setup script then prints the git command that publishes this file.
# The workflow skips quietly until the values it needs are filled in.
#
# None of these values are secrets: the IDs grant nothing on their own (only
# GitHub runs on main of this repository can sign in with them).
# API keys and passwords live only in .env.azure (never committed) and in the
# container app's secrets.
#
# Format: KEY=value, one per line, no quotes, no spaces around "=".

# --- Project: everything in Azure is named after APP_NAME ---
# Resource group <app>, container app <app>, deploy identity <app>-github,
# registry <app without dashes><first 8 hex of the subscription>, image
# <registry>.azurecr.io/<app>. Settings in .env.azure are named KEY_reflow.
# Lower-case letters, digits and dashes; starts with a letter; max 32 chars;
# must differ from every other app in the shared environment.
APP_NAME=reflow
# GitHub repository (owner/name) whose main branch may deploy. Not used for
# any Azure name.
GITHUB_REPO=MohithMohan2004/ReFlow-AI
# Numeric owner and repository IDs (gh api repos/<owner>/<repo>), for the
# ID form of GitHub's OIDC subject. github-setup.sh re-checks them.
GITHUB_OWNER_ID=167422100
GITHUB_REPO_ID=1345636715

# --- Current host (left running; only read by deploy/render-env.sh) ---
# Render service whose settings are copied into .env.azure (it serves
# https://reflow-w9xu.onrender.com). If the name is wrong, render-env.sh
# lists the services your API key can see.
RENDER_SERVICE_NAME=reflow

# --- Azure subscription and region ---
AZURE_SUBSCRIPTION_ID=82aaf9d4-d161-4dab-8ecf-dff34de35353
AZURE_LOCATION=centralindia

# --- Shared Container Apps environment (read only: never created or changed) ---
ACA_ENV_NAME=purva-bot-env
ACA_ENV_RESOURCE_GROUP=purva-bot

# --- Container app size ---
# Path that answers 200 cheaply once the app is up. The app has no /health
# route; "/" returns the built web app's index.html from disk (no database
# or Supabase call).
HEALTH_PATH=/
# vCPU and memory per replica (valid pairs: 0.25/0.5Gi, 0.5/1Gi, 0.75/1.5Gi ...).
CPU=0.5
MEMORY=1Gi
# 1 = always on (the OCEMS feed warmer keeps running and nobody waits ~30 s
# for a cold start); 0 = sleeps when idle (cheaper).
MIN_REPLICAS=1
# Must stay 1: tanker documents are saved on the container's disk, and the
# app's locks, OCEMS cache and export jobs live in one process.
MAX_REPLICAS=1

# --- Written by deploy/azure.sh ---
# Container registry (Basic) for this project only.
ACR_NAME=
# Public address of the container app.
BACKEND_URL=

# --- Written by deploy/github-setup.sh ---
# Client ID of the deploy identity <app>-github, and the Azure tenant.
AZURE_CLIENT_ID=
AZURE_TENANT_ID=

# --- Website ---
# None separate: the React web app is built into the same image and served by
# Flask from the same address (it relies on same-origin session cookies), so
# there is no Static Web App, no CORS and no WEB_ENV_ settings.
