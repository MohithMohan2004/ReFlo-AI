<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReFlow</title>
<style>
  :root { --brand:#1463d6; --ink:#0f172a; --muted:#64748b; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e2e8f0; --muted:#94a3b8; --bg:#0b1220; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px 16px; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  main { max-width:360px; }
  img { width:72px; height:72px; }
  h1 { font-size:22px; margin:20px 0 8px; }
  h1 span { background:linear-gradient(90deg,#2f6bff,#0d9488); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 28px;
           font-size:16px; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="brand-mark.svg" alt="">
  <h1>Re<span>Flow</span> can't connect</h1>
  <p>Check your internet connection and try again.</p>
  <button id="retry">Try again</button>
</main>
<script src="server.js"></script>
<script>
  document.getElementById("retry").onclick = function () {
    if (window.REFLOW_SERVER_URL) location.href = window.REFLOW_SERVER_URL; else location.reload();
  };
</script>
</body>
</html>
