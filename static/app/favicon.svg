<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ReFlow mark ("Blocks"): three quarter-circles hand the curve from one block to the next,
       and the flow ends as a single bead of treated water. 48-unit grid, 2-unit gutter,
       set on a white tile. -->
